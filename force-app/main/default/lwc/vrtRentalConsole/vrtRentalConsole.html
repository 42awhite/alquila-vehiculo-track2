<template>
    <lightning-card title="Consola de Alquileres">
        <lightning-button
            slot="actions"
            label="Nuevo Alquiler"
            onclick={openModal}>
        </lightning-button>

        <div class="slds-p-horizontal_small">
            <!-- BLOQUE NUEVO: combo de filtro por Estado, arriba de la tabla -->
            <lightning-combobox
                label="Filtrar por Estado"
                value={statusFilter}
                options={statusOptions}
                onchange={handleStatusFilterChange}
                class="slds-m-bottom_small">
            </lightning-combobox>

            <template if:true={error}>
                <div class="slds-text-color_error">Error al cargar los alquileres.</div>
            </template>

            <!-- data ahora apunta a filteredRentals (no a rentals directo), y se añaden sorted-by/onsort -->
            <lightning-datatable
                key-field="Id"
                data={filteredRentals}
                columns={columns}
                sorted-by={sortedBy}
                sorted-direction={sortedDirection}
                onsort={handleSort}
                hide-checkbox-column>
            </lightning-datatable>
        </div>
    </lightning-card>

    <template if:true={isModalOpen}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Nuevo Alquiler</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-record-picker
                        label="Vehículo"
                        object-api-name="VRT_Vehicle__c"
                        onchange={handleVehicleChange}>
                    </lightning-record-picker>

                    <lightning-input
                        type="date"
                        label="Fecha Inicio"
                        onchange={handleStartDateChange}
                        class="slds-m-top_small">
                    </lightning-input>

                    <lightning-input
                        type="date"
                        label="Fecha Final"
                        onchange={handleEndDateChange}
                        class="slds-m-top_small">
                    </lightning-input>

                    <lightning-button
                        label="Simular Precio"
                        onclick={handleSimulate}
                        disabled={isSimulating}
                        class="slds-m-top_small">
                    </lightning-button>

                    <template if:true={simulatedPrice}>
                        <div class="slds-text-heading_small slds-m-top_small">
                            Precio estimado: {simulatedPrice} €
                        </div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancelar"
                        onclick={closeModal}>
                    </lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Crear Alquiler"
                        onclick={handleCreate}
                        disabled={isSaving}
                        class="slds-m-left_x-small">
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
